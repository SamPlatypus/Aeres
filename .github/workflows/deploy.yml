name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build app
        run: npm run build

      - name: Prerender static site for GitHub Pages
        run: |
          mkdir -p dist
          cp -r .vercel/output/static/* dist/
          npx vite preview --port 8089 &
          PREV_PID=$!
          sleep 5
          curl -s http://127.0.0.1:8089/ > dist/index.html
          kill $PREV_PID || true
          cp dist/index.html dist/404.html
          sed -i "s|<head>|<head><base href=\"/Aeres/\">|g" dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
